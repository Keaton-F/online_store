{% extends "catalog/base.html" %}

{% block content %}
<div class="container mt-5">
    <h1>{{ product.name }}</h1>

    {% if product.image %}
        <div class="my-4">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid rounded shadow-sm">
        </div>
    {% endif %}

    <p class="lead">{{ product.description }}</p>
    <h3 class="my-4">Цена: {{ product.price }} ₽</h3>

    <div class="text-center mt-5 pt-3 border-top">
        <a href="{% url 'product_update' product.pk %}" class="btn btn-warning btn-lg me-3">✏️ Редактировать товар</a>
        <a href="{% url 'product_delete' product.pk %}" class="btn btn-danger btn-lg">🗑️ Удалить товар</a>
        <div class="mt-3">
            <a href="{% url 'home' %}" class="text-muted">← Вернуться к каталогу</a>
        </div>
    </div>
</div>
{% endblock %}
