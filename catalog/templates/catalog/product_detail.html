{% extends "catalog/base.html" %}

{% block content %}

<div class="container">
    <h1>{{ product.name }}</h1>

    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    {% endif %}

    <p>{{ product.description }}</p>
    <p>Цена: {{ product.price }} ₽</p>

    <a href="{% url 'home' %}">Вернуться к каталогу</a>
</div>

{% endblock %}
