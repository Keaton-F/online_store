<nav class="ms-5 d-flex align-items-center gap-2">
    <a class="p-2 btn btn-outline-primary" href="{% url 'home' %}">Каталог</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'contacts' %}">Контакты</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'blogs:list' %}">Блог</a>

    {% if user.is_authenticated %}
        <span class="ms-3 text-muted small">Привет, <strong>{{ user.email }}</strong>!</span>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
        </form>
    {% else %}
        <a class="p-2 btn btn-outline-success ms-3" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-primary" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
