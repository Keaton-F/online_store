{% extends "catalog/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow border-danger">
                <div class="card-header bg-danger text-white">
                    <h3 class="card-title mb-0">Подтверждение удаления</h3>
                </div>
                <div class="card-body text-center py-4">
                    <p class="lead mb-4">
                        Вы уверены, что хотите безвозвратно удалить товар <br>
                        <strong class="text-danger">"{{ object.name }}"</strong>?
                    </p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger px-4 me-2">Да, удалить</button>
                        <a href="{% url 'home' %}" class="btn btn-secondary px-4">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
