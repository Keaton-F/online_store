{% extends "catalog/base.html" %}

{% block content %}
    <div class="container py-4">
        <h1 class="mb-4">
            {% if object %}
                Редактирование статьи
            {% else %}
                Создание статьи
            {% endif %}
        </h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="{{ form.title.id_for_label }}" class="form-label">
                    Заголовок
                </label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label for="{{ form.content.id_for_label }}" class="form-label">
                    Содержание
                </label>
                {{ form.content }}
            </div>

            <div class="mb-3">
                <label for="{{ form.preview.id_for_label }}" class="form-label">
                    Изображение
                </label>
                {{ form.preview }}
            </div>

            <div class="form-check mb-4">
                {{ form.is_published }}
                <label for="{{ form.is_published.id_for_label }}" class="form-check-label">
                    Опубликовать
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>

            <a href="{% url 'blogs:list' %}" class="btn btn-secondary">
                Отмена
            </a>
        </form>
    </div>
{% endblock %}
